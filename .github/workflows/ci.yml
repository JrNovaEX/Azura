name: CI

# Format, lint and test on every push and pull request. Linux is the only
# platform Azura supports, so this is the whole matrix.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint and test
    # Pinned, not `ubuntu-latest`: that label moves to Ubuntu 26 on
    # 2026-10-19, and a runner change should not be able to break the build
    # on its own. Bump this deliberately, after a green run on the new one.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libgl1-mesa-dev libxcb-shape0-dev libxcb-randr0-dev libxcb-xfixes0-dev \
            libxcb-cursor-dev libxcb1-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: The app still builds
        run: cargo build --release