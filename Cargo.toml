[workspace]
resolver = "2"
members = ["crates/azura", "crates/azura-core", "crates/azura-platform"]

[workspace.package]
version = "1.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/JrNovaEX/Azura"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

[profile.dev.package."*"]
opt-level = 1
