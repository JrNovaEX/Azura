[package]
name = "azura"
description = "Azura (آزورا): launch your apps and commands together, in order"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
azura-core = { path = "../azura-core" }
azura-platform = { path = "../azura-platform" }
gpui-kit = "0.7"
# The two below are already in GPUI's dependency tree.
futures = "0.3"
rust-embed = { version = "8", features = ["include-exclude"] }
toml = "0.9"

[build-dependencies]
# build.rs downscales the logo for the UI. The icon-theme sizes for the .deb
# are produced by packaging/linux/build-deb.sh, which uses Pillow instead.
image = { version = "0.25", default-features = false, features = ["png"] }
