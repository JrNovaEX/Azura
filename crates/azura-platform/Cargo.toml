[package]
name = "azura-platform"
description = "OS integration for Azura: application discovery, real icons and launching"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
azura-core = { path = "../azura-core" }
dirs = "6"
# Already part of GPUI's dependency tree; used here to encode icons as PNG.
image = { version = "0.25", default-features = false, features = ["png"] }
# Single-instance lock: an advisory flock, no unsafe involved.
rustix = { version = "1", features = ["fs"] }
# `kill` and `sigaction`, for the "bring the other window forward" signal.
libc = "0.2"
# Update check: one small HTTPS client (rustls), checksums, and JSON parsing.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
